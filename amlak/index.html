<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>املاک — نشانی تازه</title>
<meta http-equiv="refresh" content="0; url=https://kmm110.github.io/amlak/">
<link rel="canonical" href="https://kmm110.github.io/amlak/">
<script>
(function(){
  var to='https://kmm110.github.io/amlak/'+location.search+location.hash;
  function go(){ location.replace(to); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){ return r.unregister(); }));
    }).then(go, go);
    setTimeout(go, 1500);
  } else go();
})();
</script>
<style>body{font-family:Tahoma,sans-serif;text-align:center;padding:40px;color:#234}</style>
</head>
<body>
<p>نشانی سامانه املاک عوض شده است.</p>
<p><a href="https://kmm110.github.io/amlak/">برای رفتن به نشانی تازه این‌جا را بزنید</a></p>
</body>
</html>
