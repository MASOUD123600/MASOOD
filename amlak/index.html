<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>املاک</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0f5c4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:"Vazirmatn";font-weight:400;font-display:swap;src:url(fonts/vazirmatn-400.woff2) format("woff2")}
@font-face{font-family:"Vazirmatn";font-weight:500;font-display:swap;src:url(fonts/vazirmatn-500.woff2) format("woff2")}
@font-face{font-family:"Vazirmatn";font-weight:700;font-display:swap;src:url(fonts/vazirmatn-700.woff2) format("woff2")}
@font-face{font-family:"Vazirmatn";font-weight:800;font-display:swap;src:url(fonts/vazirmatn-800.woff2) format("woff2")}
:root{
  --bg:#f6f4ef; --surface:#ffffff; --sunk:#efece4; --ink:#1d2421; --muted:#68706b; --line:#e2ddd2;
  --accent:#0f5c4d; --accent-2:#13786a; --accent-ink:#ffffff; --soft:#e3efe9;
  --gold:#b8862f; --ok:#2f8a57; --warn:#b97a14; --bad:#c2453a;
  --shadow:0 1px 2px rgb(0 0 0/.05),0 4px 14px rgb(0 0 0/.06);
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; --nav-h:64px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101413; --surface:#181d1b; --sunk:#202725; --ink:#e9eeeb; --muted:#9aa49f; --line:#2b3330;
  --accent:#3fb59a; --accent-2:#55c7ac; --accent-ink:#06201a; --soft:#1c2f2a;
  --gold:#d9ab55; --ok:#5cbf86; --warn:#e0a648; --bad:#e46b5f; --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%;display:block}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right)) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{line-height:1.35;margin:0}
h2{font-size:19px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand .mark{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:24px;height:24px;color:var(--accent-ink)}
.brand b{display:block;font-size:17px;font-weight:800}
.brand small{display:block;font-size:12px;color:var(--muted);margin-top:-2px}
.who{font-size:12px;color:var(--muted);text-align:left}
.who b{color:var(--ink);font-weight:700}
.demo{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
  border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:500;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg,.btn svg{width:18px;height:18px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;min-height:42px}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f>span{display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.tag{display:inline-block;font-size:12px;border-radius:8px;padding:1px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.sale{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.rent{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}

/* search */
.search{display:flex;gap:8px;margin:8px 0 10px}
.search input{flex:1}
.filters{margin-bottom:12px}
.filters .stack{margin-top:10px}
.count{font-size:13px;color:var(--muted);margin:4px 2px 10px}

/* listing cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;text-decoration:none;color:inherit;position:relative}
.lc .ph{aspect-ratio:4/3;background:var(--sunk);position:relative;overflow:hidden}
.lc .ph img{width:100%;height:100%;object-fit:cover}
.lc .badges{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.lc .badges .tag{background:rgb(0 0 0/.62);color:#fff;backdrop-filter:blur(4px)}
.lc .badges .tag.gold{background:var(--gold);color:#fff}
.fav{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgb(0 0 0/.45);color:#fff;display:grid;place-items:center;cursor:pointer}
.fav svg{width:18px;height:18px}
.fav.on{color:#ff6b7a}
.lc .bd{padding:11px 13px 13px;display:flex;flex-direction:column;gap:4px;flex:1}
.lc .price{font-weight:800;font-size:16px}
.lc .price small{font-weight:500;color:var(--muted);font-size:12px}
.lc .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .meta{display:flex;gap:10px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.lc .loc{color:var(--muted);font-size:13px}
.lc.dim .ph img{filter:grayscale(.7);opacity:.7}

/* detail */
.gal{position:relative;border-radius:16px;overflow:hidden;background:var(--sunk);aspect-ratio:16/10}
.gal .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.gal .track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.gal .n{position:absolute;bottom:10px;left:10px;background:rgb(0 0 0/.6);color:#fff;border-radius:8px;font-size:12px;padding:2px 8px}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.thumbs img{width:68px;height:52px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.75;flex:none}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.spec{background:var(--sunk);border-radius:12px;padding:8px 10px}
.spec small{display:block;color:var(--muted);font-size:12px}
.spec b{font-weight:700}
.feat{display:flex;flex-wrap:wrap;gap:6px}
.feat span{background:var(--soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-size:13px}
.agentcard{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.desc{white-space:pre-wrap}
.private{border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--surface))}

/* panel */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{font-size:22px;font-weight:800}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:7px 9px}.stat small{font-size:11px}.stat b{font-size:17px}}
.tbl{display:flex;flex-direction:column;gap:8px}
.tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.tr img{width:72px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--sunk)}
.tr .mid{flex:1;min-width:0}
.tr .mid b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.upl .im{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk)}
.upl .im img{width:100%;height:100%;object-fit:cover}
.upl .im button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgb(0 0 0/.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.upl .im .first{position:absolute;bottom:4px;right:4px;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.upl .add{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:13px;text-align:center}
.upl .add svg{width:26px;height:26px}
.check{display:flex;align-items:center;gap:6px;font-size:14px}
.check input{width:18px;height:18px;min-height:0}

/* designs */
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dc{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/5;background:var(--sunk);cursor:pointer;text-decoration:none;color:#fff}
.dc img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.dc:hover img{transform:scale(1.04)}
.dc .cap{position:absolute;inset:auto 0 0;padding:30px 12px 10px;background:linear-gradient(transparent,rgb(0 0 0/.75))}
.dc .cap b{display:block}
.dc .cap small{opacity:.85}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba figure{margin:0;position:relative}
.ba img{border-radius:12px;aspect-ratio:4/3;object-fit:cover;width:100%}
.ba figcaption{position:absolute;top:6px;right:6px;background:rgb(0 0 0/.6);color:#fff;border-radius:8px;font-size:12px;padding:0 8px}
.masonry{columns:2 220px;column-gap:8px}
.masonry img{width:100%;border-radius:12px;margin-bottom:8px;break-inside:avoid;cursor:zoom-in}

/* bottom nav */
nav.tabs{position:fixed;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:600px;width:100%}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);font-size:12px;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--accent);font-weight:700}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty svg{width:48px;height:48px;opacity:.5;margin:0 auto 8px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgb(0 0 0/.25)}
.lightbox{position:fixed;inset:0;background:rgb(0 0 0/.92);z-index:70;display:grid;place-items:center;padding:16px}
.lightbox img{max-height:92vh;max-width:100%;object-fit:contain;border-radius:8px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:10px;cursor:pointer;background:none;border:0;padding:0}
.back svg{width:18px;height:18px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-width:860px){.detail{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}.detail aside{position:sticky;top:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#sale">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span>
      <span><b id="appName">املاک</b><small id="appTag">خرید، فروش و اجاره</small></span>
    </a>
    <div class="who" id="who"></div>
  </header>
  <div class="demo" id="demoBar" hidden></div>
  <main id="view"><div class="spin"></div></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
