<script>/* ===== نسخهٔ ۶ آنلاین — هستهٔ مشترک: اتصال به گیت‌هاب + رمزنگاری =====
 طرح امنیتی:
 - هر مجتمع یک مخزن خصوصی دارد. اطلاعات حسابداری با «رمز برنامهٔ مجتمع» (تصادفی، ۳۲ نویسه) رمز می‌شود.
 - رمز برنامه داخل team.json است که با «کلید مجتمع» (DK، AES-256 تصادفی) رمز شده.
 - DK برای هر کاربر جدا با کلید عمومی او (ECDH P-256) قفل می‌شود؛ کلید خصوصی کاربر با رمز خودش (PBKDF2 ۶۰۰هزار دور) قفل است.
 - یک نسخه از DK هم برای کلید عمومی «حساب مادر» (سازنده) قفل می‌شود؛ پس فقط کاربران همان مجتمع و حساب مادر می‌توانند اطلاعات را باز کنند.
 - گیت‌هاب فقط اطلاعات رمزشده را می‌بیند. کلید دسترسی مخزن (توکن) روی دستگاه با رمز کاربر قفل نگه داشته می‌شود. */
const G6E=new TextEncoder(),G6D=new TextDecoder();
const G6={
 api:(()=>{try{return localStorage.getItem('hm6_api')||'https://api.github.com'}catch(e){return 'https://api.github.com'}})(),
 ITER:600000,
 b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)},
 ub64(s){const b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u},
 b64u(u){return G6.b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
 ub64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return G6.ub64(s)},
 rnd(n){return crypto.getRandomValues(new Uint8Array(n))},
 code(n=10){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=G6.rnd(n);let s='';r.forEach(v=>s+=A[v%A.length]);return s},
 async sha(s){return G6.b64u(new Uint8Array(await crypto.subtle.digest('SHA-256',G6E.encode(s))))},
 async pwKey(pw,salt,iter){const base=await crypto.subtle.importKey('raw',G6E.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter||G6.ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
 async aes(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])},
 async enc(key,bytes){const iv=G6.rnd(12);return {iv:G6.b64(iv),ct:G6.b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes)))}},
 async dec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:G6.ub64(o.iv)},key,G6.ub64(o.ct)))},
 async encJ(key,obj){return G6.enc(key,G6E.encode(JSON.stringify(obj)))},
 async decJ(key,o){return JSON.parse(G6D.decode(await G6.dec(key,o)))},
 async ecGen(){return crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits'])},
 async pubJwk(k){const j=await crypto.subtle.exportKey('jwk',k);return {kty:j.kty,crv:j.crv,x:j.x,y:j.y}},
 async privBytes(k){return G6E.encode(JSON.stringify(await crypto.subtle.exportKey('jwk',k)))},
 async privFrom(bytes){return crypto.subtle.importKey('jwk',JSON.parse(G6D.decode(bytes)),{name:'ECDH',namedCurve:'P-256'},false,['deriveBits'])},
 async ecKey(pubJwk,priv){const pub=await crypto.subtle.importKey('jwk',pubJwk,{name:'ECDH',namedCurve:'P-256'},false,[]);
  const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pub},priv,256);return G6.aes(new Uint8Array(await crypto.subtle.digest('SHA-256',bits)))},
 /* قفل کردن برای یک کلید عمومی (ECIES): کلید موقت + ECDH + AES-GCM */
 async wrapTo(pubJwk,raw){const e=await G6.ecGen();return Object.assign({epk:await G6.pubJwk(e.publicKey)},await G6.enc(await G6.ecKey(pubJwk,e.privateKey),raw))},
 async unwrap(priv,o){return G6.dec(await G6.ecKey(o.epk,priv),o)},
 /* ---------- گیت‌هاب ---------- */
 tok:'',repo:'',etags:{},
 async gh(path,opt={}){const h=new Headers(opt.headers||{});h.set('Accept','application/vnd.github+json');h.set('X-GitHub-Api-Version','2022-11-28');if(G6.tok)h.set('Authorization','Bearer '+G6.tok);
  if(opt.body&&!h.has('Content-Type'))h.set('Content-Type','application/json');return fetch(G6.api+path,Object.assign({},opt,{headers:h,cache:'no-store'}))},
 err(r){const e=new Error(r.status===401?'gh_auth':r.status===403?'gh_forbidden':r.status===404?'gh_notfound':'gh_'+r.status);e.status=r.status;return e},
 /* خواندن یک فایل JSON از مخزن؛ با etag اگر تغییری نکرده باشد {same:true} */
 async get(file,useEtag,repo){repo=repo||G6.repo;const k=repo+'/'+file,h={};if(useEtag&&G6.etags[k])h['If-None-Match']=G6.etags[k];
  const r=await G6.gh(`/repos/${repo}/contents/${file}`,{headers:h});if(r.status===304)return {same:true};if(r.status===404)return null;if(!r.ok)throw G6.err(r);
  G6.etags[k]=r.headers.get('ETag')||'';const j=await r.json();let txt;
  if(j.content)txt=G6D.decode(G6.ub64(j.content));else{const b=await G6.gh(`/repos/${repo}/git/blobs/${j.sha}`);if(!b.ok)throw G6.err(b);txt=G6D.decode(G6.ub64((await b.json()).content))}
  return {json:JSON.parse(txt),sha:j.sha}},
 /* نوشتن؛ اگر کس دیگری زودتر نوشته باشد {conflict:true} */
 async put(file,obj,sha,msg,repo){repo=repo||G6.repo;const body={message:msg||('hesab: '+file),content:G6.b64(G6E.encode(JSON.stringify(obj)))};if(sha)body.sha=sha;
  const r=await G6.gh(`/repos/${repo}/contents/${file}`,{method:'PUT',body:JSON.stringify(body)});if(r.status===409||r.status===422)return {conflict:true};if(!r.ok)throw G6.err(r);
  const j=await r.json();delete G6.etags[repo+'/'+file];return {sha:j.content.sha}},
 /* کد ۸ حرفی مجتمع برای خرید اشتراک (مثل HM-ABCD-EFGH) */
 async cidCode(cid){const d=new Uint8Array(await crypto.subtle.digest('SHA-256',G6E.encode('hesab-cloud|'+cid))),A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=A[d[i]%32];return 'HM-'+s.slice(0,4)+'-'+s.slice(4)},
 /* رمزگشایی جعبهٔ اطلاعات برنامه (همان قالب برنامهٔ اصلی) برای پنل مادر */
 async openAppBox(box,pw){const k=await G6.pwKey(pw,G6.ub64(box.salt),box.iter||310000);let pt=await G6.dec(k,box);
  if(box.z==='gzip'){const s=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));pt=new Uint8Array(await new Response(s).arrayBuffer())}return JSON.parse(G6D.decode(pt))},
 ua(){const u=navigator.userAgent||'';return /iPhone/.test(u)?'آیفون':/iPad/.test(u)?'آیپد':/Android/.test(u)?'اندروید':/Windows/.test(u)?'کامپیوتر ویندوز':/Mac/.test(u)?'مک':'دستگاه'},
};
/* ساخت یک کاربر تازه در مخزن مجتمع: کلید دوتایی + قفل DK برای او؛ ورود اول با «کد دعوت» */
async function g6NewUserEntry(cid,uname,code,dkRaw){const kp=await G6.ecGen(),s=G6.rnd(16),k=await G6.pwKey(code,s);
 return {h:await G6.sha(cid+':'+uname.trim().toLowerCase()),s:G6.b64(s),i:G6.ITER,pub:await G6.pubJwk(kp.publicKey),wpriv:await G6.enc(k,await G6.privBytes(kp.privateKey)),wdk:await G6.wrapTo(await G6.pubJwk(kp.publicKey),dkRaw)}}
/* لینک دعوت: مخزن + توکن قفل‌شده با کد دعوت (کد جدا گفته می‌شود) */
async function g6InviteLink(base,repo,cid,name,tok,code){const s=G6.rnd(16),w=await G6.enc(await G6.pwKey(code,s),G6E.encode(tok));
 return base+'#j='+G6.b64u(G6E.encode(JSON.stringify({r:repo,c:cid,n:name,w:Object.assign({s:G6.b64(s)},w)})))}
