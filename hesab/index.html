<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حسابداری مجتمع — آنلاین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--mute:#6b7487;--line:#e2e6ee;--pri:#1f6feb;--ok:#1a7f37;--okbg:#e6f4ea;--bad:#c62828;--badbg:#fdecea;--warn:#a15c00}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#14213d;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;margin:0}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:2px;padding:0 8px}
nav button{border:0;background:none;padding:12px;font:inherit;color:var(--mute);white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;color:var(--mute)}
.kpi b{display:block;font-size:19px;margin-top:4px;color:var(--ink)}
.kpi b.pos{color:var(--bad)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input,select,textarea{font:inherit;font-size:14px;padding:8px;border:1px solid #cfd5df;border-radius:7px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.8}
.btn{font:inherit;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn.l{background:#fff;color:var(--pri)}
.btn.r{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.s{padding:3px 9px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f7f9fc;font-weight:600}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums}
.pos{color:var(--bad)}.neg{color:var(--ok)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px}
.tag.d{background:var(--badbg);color:var(--bad)}.tag.c{background:var(--okbg);color:var(--ok)}.tag.z{background:#eef0f4;color:var(--mute)}
.ch{display:flex;gap:4px;flex-wrap:wrap}
.ch button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
.ch .wa{color:#128c7e}.ch .tg{color:#229ed9}.ch .sms{color:#6a1b9a}.ch .ei{color:#e8590c}.ch .rb{color:#7b2cbf}
.ch .pref{border-color:currentColor;font-weight:800;border-width:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:20px 12px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:680px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:30;max-width:90vw}
.hint{font-size:12px;color:var(--mute)}
#chatFab{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(31,111,235,.45);cursor:pointer;z-index:40;transition:transform .15s}
#chatFab:hover{transform:scale(1.07)}#chatFab.on{background:#14213d}
.chatPanel{position:fixed;bottom:92px;right:20px;width:380px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 120px);background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:41;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.chatPanel.on{display:flex}.chHead{background:#14213d;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}.chHead .chSub{font-size:11px;color:#cbd3e1;flex:1}.chHead button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
.chList{flex:1;overflow:auto;padding:12px;background:#f4f6f9}.chm{max-width:86%;padding:9px 12px;border-radius:14px;margin:6px 0;line-height:1.9;font-size:13.5px;word-wrap:break-word}
.chm.u{background:var(--pri);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.chm.a{background:#fff;border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.chLinks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chLinks button,.chChips button{border:1px solid #bcd0f7;background:#eef4ff;color:#1d3f8a;border-radius:14px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.chChips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;background:#fff;border-top:1px solid var(--line)}
.chIn{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);background:#fff}.chIn textarea{min-height:40px;max-height:110px;resize:none;font-size:13.5px}.chIn button{border:0;background:var(--pri);color:#fff;border-radius:8px;padding:0 14px;font:inherit;cursor:pointer}
.chFoot{font-size:11px;color:var(--mute);text-align:center;padding:4px 8px 8px;background:#fff;line-height:1.8}.chFoot a{color:var(--pri)}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9aa4b5;animation:tp 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
@media print{#chatFab,.chatPanel{display:none!important}}
.help h4{margin:18px 0 6px;color:var(--pri)}.help p,.help li{line-height:2.1}.help .q{background:#f7f9fc;border-right:3px solid var(--pri);padding:8px 10px;border-radius:6px;margin:8px 0}
.help details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;background:#fff}.help summary{cursor:pointer;font-weight:700}.help mark{background:#fff3a0}
.ckd{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:#fafbfd}.ckd summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink)}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 10px;max-height:230px;overflow:auto}.ckgrid label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}.ckgrid input{width:auto}
@media print{.noprint{display:none!important}}
.pickbox{border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px;max-height:260px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 10px}
.pickbox label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}.pickbox input{width:auto}
.warnbox{background:#fff7e6;border:1px solid #ffd591;color:var(--warn);padding:10px;border-radius:8px;margin-bottom:12px}
.infobox{background:#eef4ff;border:1px solid #bcd0f7;color:#1d3f8a;padding:10px;border-radius:8px;margin-bottom:10px}
.lockbox{max-width:420px;margin:40px auto}
.lockbox .err{color:var(--bad);font-size:13px;min-height:20px;margin-top:8px}
.doc{background:#fff;padding:18px;border:1px solid var(--line);border-radius:8px}
.doc .dh{text-align:center;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:10px}
.doc .dh h2{margin:0 0 4px;font-size:18px}.doc .dh div{font-size:12px;color:#444}
.doc h4{margin:14px 0 6px}
tr.sent td{opacity:.45}
tr.tot td{font-weight:700;background:#f7f9fc}
#print{display:none}
@media print{
 body{background:#fff}
 body>*:not(#print){display:none!important}
 #print{display:block!important}
 .doc{border:0;padding:0}
 .pb{page-break-after:always}
 th,tr.tot td{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 td,th{border-bottom:1px solid #999}
 @page{size:A4;margin:12mm}
}
@media(max-width:600px){main{padding:10px}.btn{padding:8px 10px}header h1{font-size:15px}}
</style>

0و\x20رایگان\x20در\x20پیام‌رسان\x20است\x20(مثل\x20یک\x20مخاطب\x20به\x20اسم\x20«ربات\x20مجتمع\x20یاس»).\x20برنامه\x20با\x20«کلید»\x20این\x20ربات،\x20پیام\x20هر\x20واحد\x20را\x20خودکار\x20و\x20<b>خصوصی</b>\x20برای\x20خود\x20او\x20می‌فرستد.</p>\x0a<h4>ساخت\x20ربات\x20در\x20بله\x20(پیشنهادی\x20—\x20داخل\x20ایران\x20بدون\x20فیلتر)</h4><ol><li>در\x20برنامهٔ\x20بله،\x20در\x20جستجو\x20بنویسید\x20<b>@botfather</b>\x20و\x20آن\x20را\x20باز\x20کنید.</li><li>«شروع»\x20را\x20بزنید،\x20سپس\x20<b>/newbot</b>\x20را\x20بفرستید.</li>\x0a<li>یک\x20نام\x20نمایشی\x20بدهید\x20(مثلاً:\x20مدیریت\x20مجتمع\x20یاس).</li><li>یک\x20نام\x20کاربری\x20انگلیسی\x20بدهید\x20که\x20آخرش\x20<b>bot</b>\x20باشد\x20(مثلاً:\x20yas_building_bot).</li><li>BotFather\x20یک\x20«کلید»\x20(token)\x20طولانی\x20می‌فرستد.\x20آن\x20را\x20کپی\x20کنید.</li></ol>\x0a<h4>ساخت\x20ربات\x20در\x20روبیکا</h4><ol><li>در\x20روبیکا\x20<b>@BotFather</b>\x20را\x20جستجو\x20کنید\x20و\x20باز\x20کنید.</li><li>دستور\x20ساخت\x20ربات\x20جدید\x20(/newbot)\x20را\x20بزنید،\x20نام\x20و\x20نام\x20کاربری\x20بدهید.</li><li>کلید\x20(token)\x20ربات\x20را\x20کپی\x20کنید.</li></ol>\x0a<h4>ساخت\x20ربات\x20در\x20تلگرام\x20(فقط\x20با\x20VPN)</h4><ol><li>در\x20تلگرام\x20<b>@BotFather</b>\x20را\x20باز\x20کنید\x20و\x20<b>/newbot</b>\x20بفرستید؛\x20نام\x20و\x20نام\x20کاربری\x20(آخرش\x20bot)\x20بدهید\x20و\x20کلید\x20را\x20کپی\x20کنید.</li>\x0a<li>⚠\x20چون\x20تلگرام\x20در\x20ایران\x20فیلتر\x20است،\x20<b>کامپیوتر\x20میزبان</b>\x20باید\x20همیشه\x20VPN\x20روشن\x20داشته\x20باشد\x20تا\x20ربات\x20تلگرام\x20کار\x20کند.\x20اگر\x20VPN\x20ندارید،\x20از\x20بله\x20یا\x20روبیکا\x20استفاده\x20کنید.</li></ol>\x0a<h4>وصل\x20کردن\x20ربات‌ها\x20به\x20برنامه</h4><ol><li>روی\x20<b>کامپیوتر\x20میزبان</b>:\x20«پیام‌رسانی»\x20←\x20کارت\x20«📡\x20ارسال\x20خودکار\x20پیام»\x20←\x20«🤖\x20ربات‌ها».</li><li>کلید\x20هر\x20ربات\x20را\x20در\x20کادر\x20خودش\x20بچسبانید\x20و\x20«ذخیرهٔ\x20ربات‌ها»\x20را\x20بزنید.\x20برنامه\x20کلید\x20را\x20امتحان\x20می‌کند\x20و\x20اگر\x20درست\x20باشد\x20«وصل»\x20می‌نویسد.</li>\x0a<li>برنامه\x20برای\x20هر\x20واحد\x20یک\x20<b>کد\x20عضویت\x20۶\x20حرفی</b>\x20می‌سازد.</li></ol>\x0a<h4>عضو\x20کردن\x20ساکنان\x20(فقط\x20یک\x20بار)</h4><ul><li><b>برگهٔ\x20عضویت:</b>\x20«🖨\x20چاپ\x20برگهٔ\x20عضویت\x20هر\x20واحد»\x20را\x20بزنید؛\x20برای\x20هر\x20واحد\x20یک\x20برگه\x20با\x20QR\x20و\x20کد\x20آن\x20واحد\x20چاپ\x20می‌شود.\x20برگه\x20را\x20به\x20ساکن\x20بدهید\x20یا\x20زیر\x20در\x20بگذارید.</li>\x0a<li><b>یا\x20دعوت\x20با\x20پیامک:</b>\x20«📨\x20ارسال\x20دعوت\x20عضویت\x20به\x20همهٔ\x20واحدها»\x20لینک\x20و\x20کد\x20هر\x20واحد\x20را\x20برایش\x20پیامک\x20می‌کند.</li>\x0a<li>ساکن\x20ربات\x20را\x20باز\x20می‌کند،\x20«شروع»\x20را\x20می‌زند\x20و\x20<b>کد\x20واحدش</b>\x20را\x20می‌فرستد.\x20ربات\x20جواب\x20می‌دهد\x20«✔\x20ثبت\x20شد».\x20از\x20آن\x20به\x20بعد\x20پیام‌های\x20همان\x20واحد\x20خودکار\x20در\x20همان\x20پیام‌رسان\x20به\x20او\x20می‌رسد.</li>\x0a<li>اگر\x20ساکن\x20بخواهد\x20پیام\x20نگیرد،\x20کلمهٔ\x20<b>لغو</b>\x20را\x20برای\x20ربات\x20بفرستد.</li><li>کنار\x20هر\x20واحد\x20در\x20صفحهٔ\x20پیام‌رسانی\x20نوشته\x20می‌شود\x20عضو\x20کدام\x20ربات\x20است.</li></ul>\x0a<h4>کانال\x20یا\x20گروه\x20ایتا\x20(فقط\x20اطلاعیه‌های\x20عمومی)</h4><ol><li>ایتا\x20اجازهٔ\x20پیام\x20خصوصی\x20خودکار\x20به\x20افراد\x20را\x20نمی‌دهد؛\x20ولی\x20می‌شود\x20اطلاعیه‌ها\x20را\x20خودکار\x20در\x20<b>کانال\x20یا\x20گروه\x20مجتمع</b>\x20گذاشت.</li>\x0a<li>در\x20ایتا\x20برای\x20مجتمع\x20یک\x20کانال\x20یا\x20گروه\x20بسازید.</li><li>به\x20سایت\x20<b>eitaayar.ir</b>\x20بروید،\x20ثبت‌نام\x20کنید\x20و\x20طبق\x20راهنمای\x20همان\x20سایت\x20کانال\x20را\x20وصل\x20کنید\x20تا\x20«توکن»\x20بگیرید.</li>\x0a<li>توکن\x20و\x20نام\x20کاربری\x20کانال\x20(مثل\x20@yas_building)\x20را\x20در\x20«🤖\x20ربات‌ها»\x20بچسبانید\x20و\x20ذخیره\x20کنید.</li><li>در\x20کارت\x20«اطلاعیه\x20عمومی»،\x20دکمهٔ\x20«📡\x20ارسال\x20خودکار\x20اطلاعیه»\x20متن\x20را\x20در\x20کانال\x20ایتا\x20و\x20برای\x20همهٔ\x20اعضای\x20ربات‌ها\x20می‌فرستد.</li></ol>\x0a<h4>واتساپ</h4><p>واتساپ\x20برای\x20شماره‌های\x20ایرانی\x20ربات\x20 ی‌شود.</b>\x20فایل\x20برنامه\x20و\x20پایگاه‌دادهٔ\x20مشترک\x20روی\x20همان\x20کامپیوتر\x20می‌مانند؛\x20سرور\x20ابری\x20جداگانه‌ای\x20برای\x20داده‌ها\x20لازم\x20نیست.</p><p><b>نسخهٔ\x20فروش\x20خالی\x20است:</b>\x20در\x20شروع\x20هیچ\x20بلوک،\x20واحد،\x20نام،\x20مبلغ\x20یا\x20پارکینگی\x20ثبت\x20نشده\x20است.\x20مشخصات\x20مجتمع،\x20واحدها\x20و\x20مبلغ\x20شارژ\x20را\x20خریدار\x20پس\x20از\x20راه‌اندازی\x20وارد\x20می‌کند.</p>\x0a<ol><li><b>اجرای\x20ساده:</b>\x20فایل\x20<code>HesabMojtama_Network_Final.exe</code>\x20را\x20دوبار\x20کلیک\x20کنید.\x20Python\x20یا\x20نصب\x20جداگانهٔ\x20سرور\x20لازم\x20نیست؛\x20برنامه\x20مرورگر\x20را\x20باز\x20می‌کند\x20و\x20پنجرهٔ\x20سرور\x20را\x20تا\x20پایان\x20کار\x20باز\x20نگه\x20می‌دارد.\x20پورت\x20پیش‌فرض\x20هر\x20نصب\x20<code>8765</code>\x20است\x20و\x20برای\x20اجرای\x20بعدی\x20ذخیره\x20می‌شود.\x20اگر\x20همان\x20برنامه\x20دوباره\x20اجرا\x20شود،\x20صفحهٔ\x20سرورِ\x20باز\x20را\x20استفاده\x20می‌کند؛\x20اگر\x20برنامهٔ\x20دیگری\x20پورت\x20را\x20گرفته\x20باشد،\x20پورت\x20آزاد\x20بعدی\x20را\x20برمی‌گزیند\x20و\x20در\x20پنجره\x20اعلام\x20می‌کند.</li>\x0a<li><b>ورود:</b>\x20نشانی‌ای\x20را\x20که\x20در\x20پنجرهٔ\x20سرور\x20نمایش\x20داده\x20می‌شود\x20در\x20مرورگر\x20کامپیوتر\x20باز\x20کنید\x20(معمولاً\x20<code>http://127.0.0.1:8765</code>).\x20ابتدا\x20رمز\x20شبکه\x20و\x20سپس\x20رمز\x20اصلی\x20حسابداری\x20را\x20وارد\x20کنید؛\x20اگر\x20حساب\x20تازه\x20باشد،\x20برنامه\x20مرحلهٔ\x20ساخت\x20رمز\x20اصلی\x20را\x20نشان\x20می‌دهد.</li>\x0a<li><b>اتصال\x20خصوصی\x20گوشی\x20از\x20اینترنت:</b>\x20به\x20اینترنت\x20عمومی\x20نیاز\x20نیست؛\x20کامپیوتر\x20میزبان\x20و\x20گوشی\x20باید\x20اینترنت\x20داشته\x20باشند\x20و\x20به\x20شبکهٔ\x20خصوصی\x20Tailscale\x20همان\x20مجتمع\x20وصل\x20باشند.\x20Tailscale\x20روی\x20آن‌ها\x20جداگانه\x20نصب\x20و\x20راه‌اندازی\x20می‌شود.\x20در\x20پنجرهٔ\x20سرور،\x20شمارهٔ\x20پورت\x20محلی\x20را\x20ببینید\x20و\x20در\x20ترمینال\x20ویندوز\x20اجرا\x20کنید:\x20<code>tailscale\x20serve\x20--bg\x20شماره‌پورت</code>\x20(مثلاً\x20<code>tailscale\x20serve\x20
